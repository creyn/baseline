<text x="24" y="212" font-size="13" font-weight="bold" fill="#52606d">U6 · Ask the agent (~5 questions per import) · target: full answer &lt; 15 s when warm; the UI shows progress</text>
<path d="M155 244 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="191" y="257" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">1. check the question: a valid PESEL, a number of 7+ digits (also phones), an e-mail, a street address; ≤ 2,000 characters</text>
<path d="M155 338 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="191" y="351" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">2. block, explain what to remove (nothing sent)</text>
<line x1="155" y1="428" x2="382" y2="428" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="163" y="421" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">3. POST /chat { question, history[] }  (one JSON answer, not a stream; the history lives in the browser tab only)</text>
<text x="163" y="444" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ network error: nothing stored anywhere, the user asks again</text>
<path d="M385 484 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="421" y="497" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">4. the same identifier check (the browser is not trusted); ≤ 2,000 characters, history ≤ 20 messages; today's questions &lt; 50, else 429</text>
<line x1="385" y1="578" x2="158" y2="578" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="571" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">5. 422 (nothing sent to AI)</text>
<line x1="385" y1="656" x2="842" y2="656" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="649" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">6. chat(system prompt, tools[], history, question)</text>
<text x="393" y="672" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ OpenAI down or 429: 503, UI says "try again"; nothing stored</text>
<line x1="845" y1="756" x2="388" y2="756" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="615" y="749" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">7. tool_call get_trend("vitamin D", from, to) | search_text("comment about the sample")</text>
<line x1="385" y1="838" x2="612" y2="838" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="831" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">8. SELECT … WHERE userId=@me AND status=Approved (same queries as U5)</text>
<text x="393" y="854" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ SQL paused: waits; on timeout the tool returns an error and the model says so</text>
<line x1="385" y1="934" x2="842" y2="934" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="927" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">9. embeddings(query)</text>
<line x1="845" y1="972" x2="388" y2="972" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="615" y="965" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">10. vector</text>
<line x1="385" y1="1010" x2="612" y2="1010" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="1003" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">11. SELECT TOP 5 … WHERE userId=@me AND status=Approved ORDER BY VECTOR_DISTANCE(cosine, embedding, @v)</text>
