<text x="24" y="193" font-size="13" font-weight="bold" fill="#52606d">U4 · Blocked document · about 1 in 10 imports · the user fixes the masks and sends again</text>
<line x1="155" y1="225" x2="382" y2="225" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="270" y="218" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">1. GET /documents/{docId}</text>
<line x1="385" y1="263" x2="612" y2="263" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="256" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">2. SELECT newest Version WHERE userId=@me AND docId</text>
<line x1="385" y1="301" x2="158" y2="301" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="294" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">3. { verId, status: Blocked, regions[]: { page, x, y, w, h, rule } }  (no text)</text>
<path d="M130.45 339 h497.1 l12 12 v34 h-509.1 z" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="142.45" y="359" font-size="12" fill="#1f2933" font-weight="bold">The server kept nothing of the pages: the checker deleted them.</text>
<text x="142.45" y="376" font-size="12" fill="#1f2933" >The user needs their own original again.</text>
<path d="M155 459 h28 v18 h-24" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#a-raw)"/>
<text x="191" y="472" font-size="12.5" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">4. show the regions on the local masked pages</text>
<path d="M155 549 h28 v18 h-24" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#a-raw)"/>
<text x="191" y="562" font-size="12.5" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">5. the user picks the original file again; render, OCR and mask again</text>
<path d="M155 643 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="191" y="656" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">6. "This is a different file": start a new import instead (U2)</text>
<rect x="64" y="599" width="642" height="98" fill="none" stroke="#52606d" stroke-width="1.5"/>
<path d="M64 599 h46 v14 l-8 8 h-38 z" fill="#e4e7eb" stroke="#52606d" stroke-width="1.5"/>
<text x="72" y="615" font-size="12" font-weight="bold" fill="#1f2933">alt</text>
<text x="120" y="615" font-size="12" fill="#1f2933">[originalSha256 ≠ the document's]</text>
<rect x="52" y="415" width="666" height="308" fill="none" stroke="#52606d" stroke-width="1.5"/>
<path d="M52 415 h46 v14 l-8 8 h-38 z" fill="#e4e7eb" stroke="#52606d" stroke-width="1.5"/>
<text x="60" y="431" font-size="12" font-weight="bold" fill="#1f2933">alt</text>
<text x="108" y="431" font-size="12" fill="#1f2933">[the original is still open in this tab]</text>
<line x1="52" y1="509" x2="718" y2="509" stroke="#52606d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="525" font-size="12" fill="#1f2933">[the tab was closed]</text>
<path d="M155 745 h28 v18 h-24" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#a-raw)"/>
<text x="191" y="758" font-size="12.5" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">7. the user draws mask boxes over the regions (masking can be added, never removed) and approves</text>
<line x1="155" y1="795" x2="382" y2="795" stroke="#00838f" stroke-width="2"  marker-end="url(#a-masked)"/>
<text x="163" y="788" text-anchor="start" font-size="12.5" fill="#00838f" paint-order="stroke" stroke="#ffffff" stroke-width="4">8. POST /documents/{docId}/versions (application/zip: pages + manifest)</text>
<text x="163" y="811" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ network error: the UI sends the same ZIP again; the zipSha256 index returns the version made by the first try</text>
<path d="M385 851 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="421" y="864" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">9. validate as in U2; zipSha256 = SHA-256 of the ZIP</text>
<line x1="385" y1="901" x2="612" y2="901" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="894" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">10. SELECT Version WHERE docId AND (zipSha256=@z OR newest status=Uploaded)</text>
<line x1="385" y1="983" x2="158" y2="983" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="976" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">11. 200 { verId, status }  (the version made by the first try)</text>
<line x1="385" y1="1061" x2="158" y2="1061" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="1054" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">12. 409 { status: Uploaded }  (wait for it to finish)</text>
<path d="M385 1139 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="421" y="1152" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">13. verId = new UUIDv7</text>
<line x1="385" y1="1189" x2="842" y2="1189" stroke="#00838f" stroke-width="2"  marker-end="url(#a-masked)"/>
<text x="393" y="1182" text-anchor="start" font-size="12.5" fill="#00838f" paint-order="stroke" stroke="#ffffff" stroke-width="4">14. PUT incoming/{userId}/{docId}/{verId}.zip</text>
<line x1="385" y1="1227" x2="612" y2="1227" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="1220" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">15. TX: INSERT Version(Uploaded, zipSha256; UNIQUE docId + zipSha256); SET Superseded on older Blocked, PendingReview, Failed versions; COMMIT</text>
<text x="393" y="1243" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ unique violation (parallel retry): 200 with that version</text>
<line x1="385" y1="1283" x2="1072" y2="1283" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="1276" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">16. send check: CheckRequested { userId, docId, verId }</text>
<text x="393" y="1299" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ API dies here: the sweeper sends it</text>
<line x1="385" y1="1339" x2="158" y2="1339" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="1332" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">17. 202 { verId, status: Uploaded }</text>
<rect x="52" y="939" width="666" height="442" fill="none" stroke="#52606d" stroke-width="1.5"/>
<path d="M52 939 h46 v14 l-8 8 h-38 z" fill="#e4e7eb" stroke="#52606d" stroke-width="1.5"/>
<text x="60" y="955" font-size="12" font-weight="bold" fill="#1f2933">alt</text>
<text x="108" y="955" font-size="12" fill="#1f2933">[same zipSha256: a retry]</text>
<line x1="52" y1="1021" x2="718" y2="1021" stroke="#52606d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="1037" font-size="12" fill="#1f2933">[the newest version is still Uploaded]</text>
<line x1="52" y1="1099" x2="718" y2="1099" stroke="#52606d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="1115" font-size="12" fill="#1f2933">[new]</text>
<path d="M20 1403 h789.7 l12 12 v34 h-801.7 z" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="32" y="1423" font-size="12" fill="#1f2933" font-weight="bold">From here on exactly as U2: checker, extractor, status, review.</text>
<text x="32" y="1440" font-size="12" fill="#1f2933" >The blocked version stays as history (Superseded, with its regions); the UI shows the newest version.</text>
<line x1="1075" y1="1479" x2="1302" y2="1479" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="1190" y="1472" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">18. CheckRequested … (as in U2)</text>
<line x1="40" y1="1619" x2="80" y2="1619" stroke="#c62828" stroke-width="2"/>
<text x="90" y="1623" font-size="13" fill="#1f2933">plaintext original or unmasked personal data</text>
