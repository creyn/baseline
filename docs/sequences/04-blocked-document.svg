<text x="1535" y="1607" text-anchor="middle" font-size="12" fill="#52606d">Python, least privilege</text>
<line x1="1535" y1="136" x2="1535" y2="1564" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="20" y1="180" x2="1670" y2="180" stroke="#cbd2d9" stroke-width="1"/>
<text x="24" y="174" font-size="13" font-weight="bold" fill="#52606d">U4 · Blocked document · about 1 in 10 imports · the user fixes the masks and sends again</text>
<line x1="155" y1="206" x2="382" y2="206" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="270" y="199" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">1. GET /documents/{docId}</text>
<line x1="385" y1="244" x2="612" y2="244" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="237" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">2. SELECT newest Version WHERE userId=@me AND docId</text>
<line x1="385" y1="282" x2="158" y2="282" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="275" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">3. { verId, status: Blocked, regions[]: { page, x, y, w, h, rule } }  (no text)</text>
<path d="M130.45 320 h497.1 l12 12 v34 h-509.1 z" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="142.45" y="340" font-size="12" fill="#1f2933" font-weight="bold">The server kept nothing of the pages: the checker deleted them.</text>
<text x="142.45" y="357" font-size="12" fill="#1f2933" >The user needs their own original again.</text>
<path d="M155 440 h28 v18 h-24" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#a-raw)"/>
<text x="191" y="453" font-size="12.5" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">4. show the regions on the local masked pages</text>
<path d="M155 530 h28 v18 h-24" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#a-raw)"/>
<text x="191" y="543" font-size="12.5" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">5. the user picks the original file again; render, OCR and mask again</text>
<path d="M155 624 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="191" y="637" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">6. "This is a different file": start a new import instead (U2)</text>
<rect x="64" y="580" width="642" height="98" fill="none" stroke="#52606d" stroke-width="1.5"/>
<path d="M64 580 h46 v14 l-8 8 h-38 z" fill="#e4e7eb" stroke="#52606d" stroke-width="1.5"/>
<text x="72" y="596" font-size="12" font-weight="bold" fill="#1f2933">alt</text>
<text x="120" y="596" font-size="12" fill="#1f2933">[originalSha256 ≠ the document's]</text>
<rect x="52" y="396" width="666" height="308" fill="none" stroke="#52606d" stroke-width="1.5"/>
<path d="M52 396 h46 v14 l-8 8 h-38 z" fill="#e4e7eb" stroke="#52606d" stroke-width="1.5"/>
<text x="60" y="412" font-size="12" font-weight="bold" fill="#1f2933">alt</text>
<text x="108" y="412" font-size="12" fill="#1f2933">[the original is still open in this tab]</text>
<line x1="52" y1="490" x2="718" y2="490" stroke="#52606d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="506" font-size="12" fill="#1f2933">[the tab was closed]</text>
<path d="M155 726 h28 v18 h-24" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#a-raw)"/>
<text x="191" y="739" font-size="12.5" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">7. the user draws mask boxes over the regions (masking can be added, never removed) and approves</text>
<line x1="155" y1="776" x2="382" y2="776" stroke="#00838f" stroke-width="2"  marker-end="url(#a-masked)"/>
<text x="163" y="769" text-anchor="start" font-size="12.5" fill="#00838f" paint-order="stroke" stroke="#ffffff" stroke-width="4">8. POST /documents/{docId}/versions (application/zip: pages + manifest)</text>
<text x="163" y="792" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ network error: the UI sends the same ZIP again; the zipSha256 index returns the version made by the first try</text>
<path d="M385 832 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="421" y="845" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">9. validate as in U2; zipSha256 = SHA-256 of the ZIP</text>
<line x1="385" y1="882" x2="612" y2="882" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="875" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">10. SELECT Document WHERE userId=@me AND docId (else 404); SELECT Version WHERE docId AND ((zipSha256=@z AND status IN (Uploaded, Blocked, PendingReview, Approved)) OR newest status=Uploaded)</text>
<line x1="385" y1="964" x2="158" y2="964" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="957" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">11. 200 { verId, status }  (the version made by the first try)</text>
<line x1="385" y1="1042" x2="158" y2="1042" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="1035" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">12. 409 { status: Uploaded }  (wait for it to finish)</text>
<path d="M385 1120 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="421" y="1133" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">13. verId = new UUIDv7</text>
<line x1="385" y1="1170" x2="842" y2="1170" stroke="#00838f" stroke-width="2"  marker-end="url(#a-masked)"/>
<text x="393" y="1163" text-anchor="start" font-size="12.5" fill="#00838f" paint-order="stroke" stroke="#ffffff" stroke-width="4">14. PUT incoming/{userId}/{docId}/{verId}.zip</text>
<line x1="385" y1="1208" x2="612" y2="1208" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="1201" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">15. TX: lock Document (UPDLOCK); a version Uploaded → rollback, 409; INSERT Version(Uploaded, zipSha256; UNIQUE docId + zipSha256 among live versions, ADR-0016); SET Superseded on older Blocked, PendingReview versions; DELETE older Failed versions (ADR-0016); COMMIT</text>
<text x="393" y="1224" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ unique violation (parallel retry): 200 with that version; this try's incoming ZIP is an orphan, the lifecycle deletes it after 24 h</text>
<line x1="385" y1="1264" x2="1072" y2="1264" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="1257" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">16. DELETE the blobs of the deleted Failed versions (incoming, clean, text)</text>
<text x="393" y="1280" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ API dies here: orphan blobs; the daily orphan sweep deletes them</text>
<line x1="385" y1="1320" x2="1302" y2="1320" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="1313" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">17. send check: CheckRequested { userId, docId, verId }</text>
<text x="393" y="1336" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ API dies here: the sweeper sends it</text>
<line x1="385" y1="1376" x2="158" y2="1376" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="1369" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">18. 202 { verId, status: Uploaded }</text>
<rect x="52" y="920" width="666" height="498" fill="none" stroke="#52606d" stroke-width="1.5"/>
<path d="M52 920 h46 v14 l-8 8 h-38 z" fill="#e4e7eb" stroke="#52606d" stroke-width="1.5"/>
<text x="60" y="936" font-size="12" font-weight="bold" fill="#1f2933">alt</text>
<text x="108" y="936" font-size="12" fill="#1f2933">[same zipSha256, a live version: a retry]</text>
<line x1="52" y1="1002" x2="718" y2="1002" stroke="#52606d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="1018" font-size="12" fill="#1f2933">[the newest version is still Uploaded]</text>
<line x1="52" y1="1080" x2="718" y2="1080" stroke="#52606d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="1096" font-size="12" fill="#1f2933">[new]</text>
<path d="M20 1440 h789.7 l12 12 v34 h-801.7 z" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="32" y="1460" font-size="12" fill="#1f2933" font-weight="bold">From here on exactly as U2: checker, extractor, status, review.</text>
<text x="32" y="1477" font-size="12" fill="#1f2933" >The blocked version stays as history (Superseded, with its regions); the UI shows the newest version.</text>
<line x1="1305" y1="1516" x2="1532" y2="1516" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="1420" y="1509" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">19. CheckRequested … (as in U2)</text>
<line x1="40" y1="1656" x2="80" y2="1656" stroke="#c62828" stroke-width="2"/>
<text x="90" y="1660" font-size="13" fill="#1f2933">plaintext original or unmasked personal data</text>
<line x1="454.4" y1="1656" x2="494.4" y2="1656" stroke="#00838f" stroke-width="2"/>
<text x="504.4" y="1660" font-size="13" fill="#1f2933">masked data only</text>
<line x1="656" y1="1656" x2="696" y2="1656" stroke="#3e4c59" stroke-width="2"/>
<text x="706" y="1660" font-size="13" fill="#1f2933">call</text>
<line x1="766.4" y1="1656" x2="806.4" y2="1656" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5"/>
<text x="816.4" y="1660" font-size="13" fill="#1f2933">response</text>
<path d="M907.2 1646 h30 l10 10 v10 h-40 z" fill="#fff8c5" stroke="#b7950b" stroke-width="1.5"/>
<text x="957.2" y="1660" font-size="13" fill="#1f2933">open question</text>
<path d="M1086 1646 h30 l10 10 v10 h-40 z" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="1136" y="1660" font-size="13" fill="#1f2933">note: a fact, e.g. the user closes the browser</text>
<rect x="1515.6" y="1646" width="40" height="18" fill="#e8f5e9"/><rect x="1515.6" y="1646" width="5" height="18" fill="#2e7d32"/>
<text x="1565.6" y="1660" font-size="13" fill="#1f2933">success path in an alt</text>

