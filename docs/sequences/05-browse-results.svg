<path d="M111.19999999999999 225 h535.6 l12 12 v34 h-547.6 z" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="123.19999999999999" y="245" font-size="12" fill="#1f2933" font-weight="bold">After idle time the API container and the serverless SQL are asleep:</text>
<text x="123.19999999999999" y="262" font-size="12" fill="#1f2933" >the first request waits for them to start (accepted, not measured).</text>
<line x1="155" y1="301" x2="382" y2="301" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="163" y="294" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">1. GET /results?parameter={p}&amp;from={d1}&amp;to={d2}  (signed in: Entra External ID)</text>
<text x="163" y="317" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ API asleep: waits for the cold start; UI shows a spinner</text>
<line x1="385" y1="357" x2="612" y2="357" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="393" y="350" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">2. SELECT LabResult WHERE userId=@me AND status=Approved AND parameterId=@p ORDER BY date  (one Approved version per document)</text>
<text x="393" y="373" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ SQL paused: wakes up, the request waits; on timeout 503, UI retries</text>
<line x1="385" y1="413" x2="158" y2="413" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="270" y="406" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">3. { series[] + range, flag, docId, verId, pageSha }</text>
