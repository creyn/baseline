<text x="24" y="193" font-size="13" font-weight="bold" fill="#52606d">U10 · Delete the account, or withdraw consent · once · target: our data gone &lt; 1 h; the Entra account removed by the owner</text>
<path d="M385 225 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="421" y="238" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">1. "Withdraw consent and delete everything? This cannot be undone." → confirm</text>
<line x1="385" y1="275" x2="842" y2="275" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="615" y="268" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">2. DELETE /me  (also POST /consent/withdraw)</text>
<line x1="845" y1="313" x2="1072" y2="313" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="853" y="306" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">3. TX: SET User.status = Deleting; INSERT DeletionMarker(prefix = {userId}/, oid); DELETE Consent; COMMIT</text>
<text x="853" y="329" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ rollback: nothing changed; 500, UI retries</text>
<line x1="845" y1="369" x2="388" y2="369" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="615" y="362" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">4. 202; session cookie cleared; signed out</text>
<path d="M528.8499999999999 407 h620.3000000000001 l12 12 v34 h-632.3000000000001 z" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="540.8499999999999" y="427" font-size="12" fill="#1f2933" font-weight="bold">From now on a sign-in with this oid shows "Your account is being deleted" (U1),</text>
<text x="540.8499999999999" y="444" font-size="12" fill="#1f2933" >and status events for its documents change 0 rows.</text>
<line x1="845" y1="483" x2="1302" y2="483" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="853" y="476" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">5. DELETE every blob under incoming/{userId}/</text>
<line x1="845" y1="521" x2="1532" y2="521" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="853" y="514" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">6. DELETE every blob under clean/{userId}/</text>
<line x1="845" y1="559" x2="1762" y2="559" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="853" y="552" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">7. DELETE every blob under text/{userId}/</text>
<text x="853" y="575" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ API dies here: the marker stays; the sweeper finishes the blobs</text>
<line x1="845" y1="615" x2="1072" y2="615" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="853" y="608" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">8. TX: DELETE Fragments, LabResults, Extractions, Versions, Documents, DailyUsage WHERE userId; DELETE User; COMMIT  (aliases are shared: kept)</text>
<text x="853" y="631" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ API dies here: the marker stays; the sweeper repeats both steps (idempotent)</text>
<path d="M845 671 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="881" y="684" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">9. log AccountDeleted { oid }  (an identifier only) → alert rule</text>
<line x1="845" y1="721" x2="158" y2="721" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="837" y="714" text-anchor="end" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">10. alert e-mail: remove the account { oid } in Entra</text>
<line x1="845" y1="759" x2="1072" y2="759" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="853" y="752" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">11. DELETE DeletionMarker</text>
<line x1="155" y1="797" x2="612" y2="797" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="385" y="790" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">12. delete the user { oid } by hand; then delete it permanently from "Deleted users"</text>
<text x="385" y="813" text-anchor="middle" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ not done: the e-mail stays in Entra; the soft-deleted user is purged by Entra after 30 days</text>
<path d="M248.8 853 h720.4 l12 12 v34 h-732.4 z" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="260.8" y="873" font-size="12" fill="#1f2933" font-weight="bold">Until the owner removes the account, the person can still sign in. With no User row they see</text>
<text x="260.8" y="890" font-size="12" fill="#1f2933" >the consent screen again (U1): a new, empty account is made only if they consent again.</text>
<line x1="20" y1="943" x2="1900" y2="943" stroke="#cbd2d9" stroke-width="1"/>
<text x="24" y="937" font-size="13" font-weight="bold" fill="#52606d">Always: the sweeper · every 5 min while the API is awake; a cron scale rule wakes the API once a day</text>
<line x1="845" y1="969" x2="1072" y2="969" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="853" y="962" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">13. SELECT DeletionMarker</text>
<path d="M845 1051 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="881" y="1064" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">14. repeat: blobs under {userId}/, rows, the AccountDeleted log (oid from the marker), marker</text>
<rect x="742" y="1007" width="1126" height="98" fill="none" stroke="#52606d" stroke-width="1.5"/>
<path d="M742 1007 h46 v14 l-8 8 h-38 z" fill="#e4e7eb" stroke="#52606d" stroke-width="1.5"/>
<text x="750" y="1023" font-size="12" font-weight="bold" fill="#1f2933">alt</text>
<text x="798" y="1023" font-size="12" fill="#1f2933">[marker of an account found]</text>
