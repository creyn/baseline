<text x="40" y="40" font-size="24" font-weight="bold" fill="#1f2933">U10 · Delete the account or withdraw consent</text>
<text x="40" y="64" font-size="14" fill="#52606d">Everything of a person lies under one prefix and one userId (ADR-0006, 0012); the owner removes the Entra account by hand (ADR-0010). Alternatives are alt frames (success path in green); red ✗ = state after an infrastructure failure. SLA</text>
<text x="40" y="83" font-size="14" fill="#52606d">targets are proposals (p95).</text>
