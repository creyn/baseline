<text x="24" y="193" font-size="13" font-weight="bold" fill="#52606d">U9 · Reprocess after an extraction fix, or "Retry" after Failed · the user starts it for one document</text>
<line x1="140" y1="225" x2="337" y2="225" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="240" y="218" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">1. POST /documents/{docId}/reprocess</text>
<line x1="340" y1="263" x2="537" y2="263" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="348" y="256" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">2. SELECT newest Version WHERE userId=@me AND docId</text>
<line x1="340" y1="301" x2="737" y2="301" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="348" y="294" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">3. HEAD clean/{userId}/{docId}/{verOld}.zip</text>
<line x1="340" y1="383" x2="143" y2="383" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="240" y="376" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">4. 409 { status: Uploaded }</text>
<line x1="340" y1="461" x2="143" y2="461" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="240" y="454" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">5. 409 { needsOriginal: true }</text>
<path d="M140 499 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="176" y="512" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">6. "Pick the original again": mask and send a new version, as U4</text>
<path d="M340 589 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="376" y="602" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">7. verNew = new UUIDv7</text>
<line x1="340" y1="639" x2="737" y2="639" stroke="#00838f" stroke-width="2"  marker-end="url(#a-masked)"/>
<text x="348" y="632" text-anchor="start" font-size="12.5" fill="#00838f" paint-order="stroke" stroke="#ffffff" stroke-width="4">8. COPY clean/{userId}/{docId}/{verOld}.zip → {verNew}.zip  (server-side copy; same bytes and page hashes)</text>
<text x="348" y="655" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ copy fails: 503, nothing changed</text>
<line x1="340" y1="695" x2="537" y2="695" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="348" y="688" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">9. TX: INSERT Version(verNew, Uploaded, reprocessOf = verOld); SET Superseded on older Blocked, PendingReview, Failed versions; COMMIT</text>
<text x="348" y="711" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ rollback: an orphan copy; the daily orphan sweep deletes it</text>
<line x1="340" y1="751" x2="937" y2="751" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="348" y="744" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">10. send extract: ExtractRequested { userId, docId, verId: verNew }  (the pages were checked already)</text>
<text x="348" y="767" text-anchor="start" font-size="11.5" font-style="italic" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">✗ API dies here: the sweeper resends ExtractRequested for versions made from a checked ZIP</text>
<line x1="340" y1="807" x2="143" y2="807" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="240" y="800" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">11. 202 { verId: verNew }</text>
<rect x="52" y="339" width="1176" height="510" fill="none" stroke="#52606d" stroke-width="1.5"/>
<path d="M52 339 h46 v14 l-8 8 h-38 z" fill="#e4e7eb" stroke="#52606d" stroke-width="1.5"/>
<text x="60" y="355" font-size="12" font-weight="bold" fill="#1f2933">alt</text>
<text x="108" y="355" font-size="12" fill="#1f2933">[status = Uploaded: still processing]</text>
<line x1="52" y1="421" x2="1228" y2="421" stroke="#52606d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="437" font-size="12" fill="#1f2933">[no clean ZIP: Blocked, or Failed before the check passed (integrity, check_error, timeout)]</text>
<line x1="52" y1="549" x2="1228" y2="549" stroke="#52606d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="565" font-size="12" fill="#1f2933">[clean ZIP present: PendingReview, Approved, Failed in extraction (extract_*, no_results, timeout)]</text>
<path d="M139.14999999999998 871 h789.7 l12 12 v34 h-801.7 z" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="151.14999999999998" y="891" font-size="12" fill="#1f2933" font-weight="bold">An Approved version stays the one that is read until the user approves the new one (review as in U3);</text>
<text x="151.14999999999998" y="908" font-size="12" fill="#1f2933" >then it becomes Archived. A PendingReview version is Superseded at once: the newer one matters more.</text>
<line x1="940" y1="947" x2="1137" y2="947" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="1040" y="940" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">12. ExtractRequested … (as in U2, Extractor)</text>
<line x1="20" y1="999" x2="1260" y2="999" stroke="#cbd2d9" stroke-width="1"/>
<text x="24" y="993" font-size="13" font-weight="bold" fill="#52606d">U9 · Reprocess after a masking fix · the user imports the original again</text>
<path d="M140 1025 h28 v18 h-24" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#a-raw)"/>
<text x="176" y="1038" font-size="12.5" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">13. the user picks the original; originalSha256 = the same</text>
<line x1="140" y1="1075" x2="337" y2="1075" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="240" y="1068" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">14. GET /documents?originalSha256={h}  (before masking, as in U2)</text>
<line x1="340" y1="1113" x2="537" y2="1113" stroke="#3e4c59" stroke-width="2"  marker-end="url(#a-normal)"/>
<text x="348" y="1106" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">15. SELECT Document WHERE userId=@me AND originalSha256=@h → found</text>
<line x1="340" y1="1151" x2="143" y2="1151" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-normal)"/>
<text x="240" y="1144" text-anchor="middle" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">16. 200 { docId, newest version and status }</text>
<path d="M140 1189 h28 v18 h-24" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#a-normal)"/>
<text x="176" y="1202" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">17. "Imported already. Import as a new version?" → yes; mask with the fixed rules</text>
<line x1="140" y1="1239" x2="337" y2="1239" stroke="#00838f" stroke-width="2"  marker-end="url(#a-masked)"/>
<text x="148" y="1232" text-anchor="start" font-size="12.5" fill="#00838f" paint-order="stroke" stroke="#ffffff" stroke-width="4">18. POST /documents/{docId}/versions (ZIP) → as in U4: check, extract, review</text>
<line x1="40" y1="1379" x2="80" y2="1379" stroke="#c62828" stroke-width="2"/>
<text x="90" y="1383" font-size="13" fill="#1f2933">plaintext original or unmasked personal data</text>
<line x1="454.4" y1="1379" x2="494.4" y2="1379" stroke="#00838f" stroke-width="2"/>
<text x="504.4" y="1383" font-size="13" fill="#1f2933">masked data only</text>
<line x1="656" y1="1379" x2="696" y2="1379" stroke="#3e4c59" stroke-width="2"/>
<text x="706" y="1383" font-size="13" fill="#1f2933">call</text>
<line x1="766.4" y1="1379" x2="806.4" y2="1379" stroke="#3e4c59" stroke-width="2" stroke-dasharray="7 5"/>
<text x="816.4" y="1383" font-size="13" fill="#1f2933">response</text>
<path d="M907.2 1369 h30 l10 10 v10 h-40 z" fill="#fff8c5" stroke="#b7950b" stroke-width="1.5"/>
<text x="957.2" y="1383" font-size="13" fill="#1f2933">open question</text>
