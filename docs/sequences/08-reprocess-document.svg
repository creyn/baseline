<text x="491.5" y="202" font-size="12" fill="#1f2933" font-weight="bold">Q8: where does the parameter dictionary live?</text>
<text x="491.5" y="219" font-size="12" fill="#1f2933" >In the repository, a new parameter means a code change and a deploy</text>
<text x="491.5" y="236" font-size="12" fill="#1f2933" >before reprocessing. A user-editable dictionary is faster, but adding</text>
<text x="491.5" y="253" font-size="12" fill="#1f2933" >a word to the allowlist can reveal data. Repository + review is safer.</text>
