<text x="393" y="502" text-anchor="start" font-size="12.5" fill="#1f2933" paint-order="stroke" stroke="#ffffff" stroke-width="4">5. chat(system: organise, never diagnose; data: rows + sources; task: changes, out of range, questions for the doctor)</text>
