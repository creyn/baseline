name: CodeQL

# ADR-0013, point 6: static analysis of the code on every pull request, on main and every week.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Minified third-party bundles of the spike (pdf.js, Tesseract.js) are not our code.
          config: |
            paths-ignore:
              - spikes/**/vendor/**
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
