name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scanner tests
        run: python -m unittest discover -s tools/privacy -v
      - name: Scan the pull request
        if: github.event_name == 'pull_request'
        run: python tools/privacy/scan.py --diff origin/${{ github.base_ref }}
      - name: Scan the whole repository
        if: github.event_name == 'push'
        run: python tools/privacy/scan.py --all

  docs-mcp:
    name: Docs MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/docs-mcp -v

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r contracts/requirements.txt
      - run: python -m unittest discover -s contracts -v

  extractor:
    name: Extractor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r services/extractor/requirements.txt
      - run: python -m unittest discover -s services/extractor -t services/extractor -v
      - name: Smoke test's own parts (offline)
        run: python -m unittest discover -s tools/smoke -v
      - name: The extractor's image builds (ADR-0019)
        run: docker build -f services/extractor/Dockerfile -t extractor:ci .
      - name: The image starts and finds its code and contracts
        run: docker run --rm --entrypoint python extractor:ci -c "import extractor.main, extractor.contracts as c; c.schema('text.v1'); print('ok')"

  evals-offline:
    name: Extraction evals (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r contracts/requirements.txt
      - run: python -m unittest discover -s evals/extraction -v

  synthetic:
    name: Synthetic documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the generator's dependencies and font
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
          python -m pip install -q -r evals/synthetic/requirements.txt
      - name: Tests (descriptions and generated files)
        run: python -m unittest discover -s evals/synthetic -v
      - name: Generate
        run: python evals/synthetic/generate.py --out synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-documents
          path: synthetic
          retention-days: 14

  spikes:
    name: Spike tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'spikes/**/*.test.mjs'

  diagrams:
    name: Diagrams match their scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The architecture and sequence diagrams must always be current. The ADR-0005 figures are frozen
      # (docs/adr/0005/README.md), so the build does not run their script.
      # Removed first, so a diagram dropped from its script but left in docs also fails the check.
      - name: Generate the diagrams
        run: |
          rm docs/architecture.svg docs/sequences/*.svg
          (cd tools/diagrams && npm run build)
      - name: Fail when an SVG differs from its script
        run: |
          git status --porcelain -- docs
          test -z "$(git status --porcelain -- docs)" || { echo "Run 'npm run build' in tools/diagrams and commit the SVG files."; exit 1; }

  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compiles and lints without Azure; the linter's warnings fail the job (bicepconfig.json).
      - run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null
