name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scanner tests
        run: python -m unittest discover -s tools/privacy -v
      - name: Scan the pull request
        if: github.event_name == 'pull_request'
        run: python tools/privacy/scan.py --diff origin/${{ github.base_ref }}
      - name: Scan the whole repository
        if: github.event_name == 'push'
        run: python tools/privacy/scan.py --all

  spikes:
    name: Spike tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'spikes/**/*.test.mjs'
