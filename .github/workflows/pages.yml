name: Spikes on GitHub Pages

# Publishes the spikes/ folder and the synthetic documents. Each spike is a static page in its own subfolder.
on:
  push:
    branches: [main]
    paths: ['spikes/**', 'evals/synthetic/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Rules tests
        run: node --test 'spikes/**/*.test.mjs'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Generate the synthetic documents
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
          python -m pip install -q -r evals/synthetic/requirements.txt
          python evals/synthetic/generate.py --out _site/synthetic
      - name: Build site
        run: |
          mkdir -p _site
          cp -r spikes _site/spikes
          find _site -name '*.test.mjs' -delete
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Baseline spikes</title></head><body style="font-family:system-ui;max-width:700px;margin:2rem auto;padding:0 16px">'
            echo '<h1>Baseline spikes</h1><ul>'
            for d in spikes/*/; do n=$(basename "$d"); echo "<li><a href=\"spikes/$n/\">$n</a></li>"; done
            echo '<li><a href="synthetic/">synthetic lab results (fictional)</a></li>'
            echo '</ul></body></html>'
          } > _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
